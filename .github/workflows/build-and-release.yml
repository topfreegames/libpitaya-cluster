name: Build and Release NPitaya Native Libraries
on:
  push:
    tags:
      - "*"
  pull_request:
    branches:
      - master

env:
  BUILD_TYPE: Release

jobs:
  cache-check:
    name: Check consolidated cache
    runs-on: ubuntu-latest
    outputs:
      cache-hit: ${{ steps.cache-check.outputs.cache-hit }}
      cpp-lib-sha: ${{ steps.get-sha.outputs.cpp-lib-sha }}
    steps:
      - name: Checkout repo (for git SHA computation)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history needed for accurate git log

      - name: Get short SHA of latest cpp-lib change
        id: get-sha
        run: |
          # Get the short SHA of the latest commit that modified cpp-lib/ or vendor/
          # This is more reliable than hashFiles() for large directories
          CPP_LIB_SHA=$(git log -1 --format=%h -- cpp-lib/ vendor/)
          echo "cpp-lib-sha=$CPP_LIB_SHA" >> $GITHUB_OUTPUT
          echo "📝 Cache key will use cpp-lib SHA: $CPP_LIB_SHA"
          echo "📝 From commit: $(git log -1 --format='%s' -- cpp-lib/ vendor/)"

      - name: Restore consolidated libraries cache
        id: cache-consolidated-restore
        uses: actions/cache/restore@v3
        with:
          path: downloaded-artifacts
          # Use git SHA instead of hashFiles() - more reliable for large directories
          # IMPORTANT: Do NOT use restore-keys fallback - it causes stale binaries
          key: compiled-libs-${{ steps.get-sha.outputs.cpp-lib-sha }}

      - name: Check if cache was restored
        id: cache-check
        run: |
          # Use the cache action's output to determine if an EXACT key match occurred.
          # This prevents using stale binaries when source code has changed.
          CACHE_HIT="${{ steps.cache-consolidated-restore.outputs.cache-hit }}"
          if [ "$CACHE_HIT" == "true" ]; then
            echo "✅ Exact cache key match found (SHA: ${{ steps.get-sha.outputs.cpp-lib-sha }}) - skipping build"
            echo "cache-hit=true" >> $GITHUB_OUTPUT
          else
            echo "❌ No exact cache match for SHA: ${{ steps.get-sha.outputs.cpp-lib-sha }} - will run build"
            # Clean up any partially restored cache
            rm -rf downloaded-artifacts 2>/dev/null || true
            echo "cache-hit=false" >> $GITHUB_OUTPUT
          fi

  build:
    name: Build
    needs: cache-check
    if: needs.cache-check.outputs.cache-hit != 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04-x86_64
            os: ubuntu-22.04
            arch: x86_64
            preset: conan-linux-x86_64-release
            cppstd: gnu17
            runner: ubuntu-22.04
            cmake_path: build/_builds/linux-x86_64-release
          - platform: ubuntu-22.04-armv8
            os: ubuntu-22.04
            arch: armv8
            preset: conan-linux-armv8-release
            cppstd: gnu17
            runner: ubuntu-22.04-arm
            cmake_path: build/_builds/linux-armv8-release
          - platform: windows-latest-x86_64
            os: windows-latest
            arch: x86_64
            preset: conan-windows-x86_64-release
            cppstd: "17"
            runner: windows-latest
            cmake_path: build/_builds/windows-x86_64-release
          - platform: macos-14-x86_64
            os: macos-14
            arch: x86_64
            preset: conan-macos-x86_64-macosx_bundle_false-release
            cppstd: gnu17
            runner: macos-14
            cmake_path: build/_builds/macos-x86_64-macosx_bundle_false-release
          - platform: macos-14-armv8
            os: macos-14
            arch: armv8
            preset: conan-macos-armv8-macosx_bundle_false-release
            cppstd: gnu17
            runner: macos-14
            cmake_path: build/_builds/macos-armv8-macosx_bundle_false-release
    steps:
      - name: Install Conan
        id: conan
        uses: turtlebrowser/get-conan@main
        env:
          PIP_BREAK_SYSTEM_PACKAGES: 1

      - name: Optimize Conan
        run: |
          # Show Conan version and available commands
          conan --version
          conan config list
          conan profile detect
          conan remote add conancenter https://center.conan.io || true
          conan remote list

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build tools (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake make g++ gcc

      - name: Install Numpy for macOS builds
        if: matrix.os == 'macos-14'
        run: pip3 install numpy --break-system-packages

      - name: Using the builtin GitHub Cache Action for .conan
        id: cache-conan-restore
        uses: actions/cache/restore@v3
        env:
          cache-name: cache-conan-modules
        with:
          path: ~/.conan2/
          key: ${{ runner.os }}-${{ matrix.arch }}-builder-${{ env.cache-name }}-${{ hashFiles('cpp-lib/conanfile.py', 'cpp-lib/conanprofile') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-builder-${{ env.cache-name }}-
            ${{ runner.os }}-${{ matrix.arch }}-builder-

      - name: Install Conan Dependencies - Ubuntu
        if: matrix.os == 'ubuntu-22.04'
        env:
          CONAN_PARALLEL_DOWNLOAD: 8
          CONAN_PARALLEL_BUILD: 4
        run: |
          # Retry logic for transient network failures (GitHub 504 errors, etc.)
          for attempt in 1 2 3; do
            echo "🔄 Attempt $attempt of 3..."
            if conan install . -pr conanprofile -of build -s build_type=${{env.BUILD_TYPE}} -s arch=${{matrix.arch}} -s:b compiler.cppstd=${{ matrix.cppstd }} -s compiler.cppstd=${{ matrix.cppstd }} --build=missing --build=outdated; then
              echo "✅ Conan install succeeded on attempt $attempt"
              exit 0
            fi
            echo "⚠️ Attempt $attempt failed, waiting 30 seconds before retry..."
            sleep 30
          done
          echo "❌ All attempts failed"
          exit 1
        working-directory: cpp-lib

      - name: Install Conan Dependencies - Windows
        if: matrix.os == 'windows-latest'
        env:
          CONAN_PARALLEL_DOWNLOAD: 8
          CONAN_PARALLEL_BUILD: 4
        run: |
          # Retry logic for transient network failures
          $maxAttempts = 3
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            Write-Host "🔄 Attempt $attempt of $maxAttempts..."
            conan install . -pr conanprofile -of build -s build_type=${{env.BUILD_TYPE}} -s arch=${{matrix.arch}} -s:b compiler.cppstd=${{ matrix.cppstd }} -s compiler.cppstd=${{ matrix.cppstd }} --build=missing --build=outdated
            if ($LASTEXITCODE -eq 0) {
              Write-Host "✅ Conan install succeeded on attempt $attempt"
              exit 0
            }
            Write-Host "⚠️ Attempt $attempt failed, waiting 30 seconds before retry..."
            Start-Sleep -Seconds 30
          }
          Write-Host "❌ All attempts failed"
          exit 1
        shell: pwsh
        working-directory: cpp-lib

      - name: Install Conan Dependencies - macOS
        if: matrix.os == 'macos-14'
        env:
          CONAN_PARALLEL_DOWNLOAD: 8
          CONAN_PARALLEL_BUILD: 4
        run: |
          # Retry logic for transient network failures (GitHub 504 errors, etc.)
          # macOS 14 uses Xcode 15 with Apple Clang 15
          for attempt in 1 2 3; do
            echo "🔄 Attempt $attempt of 3..."
            if conan install . -pr conanprofile -of build -s build_type=${{env.BUILD_TYPE}} -s arch=${{matrix.arch}} -s:b compiler.cppstd=${{ matrix.cppstd }} -s compiler.cppstd=${{ matrix.cppstd }} -s:b compiler.libcxx=libc++ -s compiler.libcxx=libc++ -s:b compiler.version=15 -s compiler.version=15 --build=missing --build=outdated; then
              echo "✅ Conan install succeeded on attempt $attempt"
              exit 0
            fi
            echo "⚠️ Attempt $attempt failed, waiting 30 seconds before retry..."
            sleep 30
          done
          echo "❌ All attempts failed"
          exit 1
        working-directory: cpp-lib

      - name: Configure CMake
        run: cmake --preset ${{matrix.preset}} -DBUILD_TESTING=OFF
        working-directory: cpp-lib

      - name: Build
        run: cmake --build ${{matrix.cmake_path}} --config ${{env.BUILD_TYPE}} --target pitaya_cpp
        working-directory: cpp-lib

      - uses: actions/cache/save@v3
        env:
          cache-name: cache-conan-modules
        with:
          path: ~/.conan2/
          key: ${{ runner.os }}-${{ matrix.arch }}-builder-${{ env.cache-name }}-${{ hashFiles('cpp-lib/conanfile.py', 'cpp-lib/conanprofile') }}

      - uses: actions/upload-artifact@v4
        with:
          name: prebuilt-libs-${{ matrix.platform }}
          path: |
            cpp-lib/build/**/*pitaya_cpp.dll
            cpp-lib/build/**/*pitaya_cpp.so
            cpp-lib/build/**/*pitaya_cpp.dylib

  consolidate:
    name: Consolidate all libs into single package
    needs: [cache-check, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download platform specific artifacts
        if: needs.cache-check.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v4
        with:
          path: downloaded-artifacts

      - name: Restore cached artifacts (cache hit)
        if: needs.cache-check.outputs.cache-hit == 'true'
        uses: actions/cache/restore@v3
        with:
          path: downloaded-artifacts
          # Use the SHA computed in cache-check job for consistency
          key: compiled-libs-${{ needs.cache-check.outputs.cpp-lib-sha }}

      - name: Process Libs
        if: needs.cache-check.outputs.cache-hit != 'true'
        run: |
          mkdir -p macos-arm64 macos-x86_64 linux-x86_64 linux-armv8 windows-x86_64

          # Process macOS ARM64
          if [ -d "prebuilt-libs-macos-14-armv8" ]; then
            find prebuilt-libs-macos-14-armv8 -name "*.dylib" -exec cp {} macos-arm64/ \;
          fi

          # Process macOS x86_64
          if [ -d "prebuilt-libs-macos-14-x86_64" ]; then
            find prebuilt-libs-macos-14-x86_64 -name "*.dylib" -exec cp {} macos-x86_64/ \;
          fi

          # Process Linux x86_64
          if [ -d "prebuilt-libs-ubuntu-22.04-x86_64" ]; then
            find prebuilt-libs-ubuntu-22.04-x86_64 -name "*.so" -exec cp {} linux-x86_64/ \;
          fi

          # Process Linux ARMv8
          if [ -d "prebuilt-libs-ubuntu-22.04-armv8" ]; then
            find prebuilt-libs-ubuntu-22.04-armv8 -name "*.so" -exec cp {} linux-armv8/ \;
          fi

          # Process Windows x86_64
          if [ -d "prebuilt-libs-windows-latest-x86_64" ]; then
            find prebuilt-libs-windows-latest-x86_64 -name "*.dll" -exec cp {} windows-x86_64/ \;
          fi

          echo "✅ Processed libraries:"
          find . -name "*.so" -o -name "*.dylib" -o -name "*.dll" | sort
        working-directory: downloaded-artifacts

      - name: "Upload Artifact"
        uses: actions/upload-artifact@v4
        with:
          name: prebuilt-libs-all-archs
          path: |
            ./**/*pitaya_cpp.dll
            ./**/*pitaya_cpp.so
            ./**/*pitaya_cpp.dylib
          working-directory: downloaded-artifacts
          if-no-files-found: warn

      - name: Cache consolidated artifacts
        if: needs.cache-check.outputs.cache-hit != 'true'
        uses: actions/cache/save@v3
        with:
          path: downloaded-artifacts
          # Use the SHA computed in cache-check job for consistency
          key: compiled-libs-${{ needs.cache-check.outputs.cpp-lib-sha }}

  package:
    name: Package
    needs: consolidate
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download artifacts from consolidate step
        uses: actions/download-artifact@v4
        with:
          name: prebuilt-libs-all-archs
          path: downloaded-artifacts

      - name: Package
        run: VERSION=${{ github.ref_name }} ./package.sh

      - name: Upload package directory
        uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: package/
          retention-days: 1

  publish:
    name: Publish
    needs: package
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Download package directory
        uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: package

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install -g npm-cli-login
      - run: npm-cli-login login -u "${{ secrets.ARTIFACTORY_USER }}" -p "${{ secrets.ARTIFACTORY_PASS }}" -e "tools-team@tfgco.com" -r "https://artifactory.tfgco.com/artifactory/api/npm/npm-local" -s @wls
      - run: npm config set registry https://artifactory.tfgco.com/artifactory/api/npm/npm-local/

      - name: Publish to artifactory
        run: cd package && npm publish
